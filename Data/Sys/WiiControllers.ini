# The controller a Wii game starts with. What the player chooses in the VR menu, or a game's own
# settings name (a profile, PadType0, WiimoteSource0), is in front of this. A game that is not here
# has the controls of every game.
#
# Full game IDs only: the first letters of one are also those of mods that are other games. Only
# games that have this as their own way to play, and not those that also point when held sideways.

